<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro - Ejercicio 1</title>
    <link rel="stylesheet" href="./estilo/style.css">
    <script src="./script/script.js" defer></script>
</head>

<body>

    <h1 class="form-title">Registro de Usuario</h1>

    <div id="contenedor">
        <form id="registroForm">
            <div class="fila">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required autofocus>
            </div>

            <div class="fila">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" multiple required>
            </div>

            <div class="fila">
                <label for="url">Página Web:</label>
                <input type="url" id="url" name="url" placeholder="http://ejemplo.com">
            </div>

            <div class="fila">
                <label for="password1">Contraseña:</label>
                <input type="password" id="password1" name="password1" required pattern="[^\s]{6,}"
                    title="Mínimo 6 caracteres sin espacios">
            </div>

            <div class="fila">
                <label for="password2">Repetir Contraseña:</label>
                <input type="password" id="password2" name="password2" required pattern="[^\s]{6,}">
            </div>

            <div class="fila">
                <label for="conocimientos">Conocimientos (1-10):</label>
                <input type="range" id="conocimientos" name="conocimientos" min="1" max="10">
            </div>

            <div class="fila">
                <label for="fechaInicio">Fecha de Inicio:</label>
                <input type="date" id="fechaInicio" name="fechaInicio" required placeholder="dd/mm/aaaa">
            </div>

            <div class="fila">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="0" max="5">
            </div>

            <div class="fila">
                <button type="button" id="btnEnviar">Enviar Registro</button>
            </div>
        </form>
    </div>

</body>

</html>
